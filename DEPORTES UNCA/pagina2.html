<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Inscripción - Deportes Unca</title>
</head>

<body>

    <header>
        <h1>Deportes Unca</h1>
        <p>Inscripción a una actividad deportiva</p>
    </header>

    <main>

        <form action="pagina3.html" method="post">

            <!-- Información de la actividad -->
            <fieldset>
                <legend>Información de la actividad</legend>

                <div>
                    <label for="actividad">Actividad:</label>
                    <input type="text"
                           id="actividad"
                           name="actividad"
                           value="Fútbol"
                           disabled>
                </div>

                <div>
                    <label for="lugar">Lugar:</label>
                    <input type="text"
                           id="lugar"
                           name="lugar"
                           value="Cancha techada"
                           disabled>
                </div>

                <div>
                    <label for="dia">Día:</label>
                    <input type="text"
                           id="dia"
                           name="dia"
                           value="Martes y jueves"
                           disabled>
                </div>

                <div>
                    <label for="horario">Horario:</label>
                    <input type="text"
                           id="horario"
                           name="horario"
                           value="18:00 - 19:30"
                           disabled>
                </div>

            </fieldset>


            <!-- Datos del participante -->
            <fieldset>
                <legend>Datos del participante</legend>

                <div>
                    <label for="nombre">Apellido y nombre:</label>
                    <input type="text"
                           id="nombre"
                           name="nombre"
                           maxlength="100"
                           required>
                </div>

                <div>
                    <label for="dni">DNI:</label>
                    <input type="number"
                           id="dni"
                           name="dni"
                           min="10000000"
                           max="99999999"
                           required>
                </div>

                <div>
                    <label for="fecha">Fecha de nacimiento:</label>
                    <input type="date"
                           id="fecha"
                           name="fecha">
                </div>

                <div>
                    <label for="correo">Correo electrónico:</label>
                    <input type="email"
                           id="correo"
                           name="correo">
                </div>

                <div>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel"
                           id="telefono"
                           name="telefono">
                </div>

                <div>
                    <p>Sexo:</p>

                    <input type="radio"
                           id="femenino"
                           name="sexo"
                           value="femenino">
                    <label for="femenino">Femenino</label>

                    <input type="radio"
                           id="masculino"
                           name="sexo"
                           value="masculino">
                    <label for="masculino">Masculino</label>

                    <input type="radio"
                           id="no-binario"
                           name="sexo"
                           value="no-binario">
                    <label for="no-binario">No binario</label>
                </div>

            </fieldset>


            <!-- Información deportiva -->
            <fieldset>
                <legend>Información deportiva</legend>

                <div>
                    <label for="nivel">Nivel:</label>

                    <select id="nivel" name="nivel">
                        <option value="inicial">Inicial</option>
                        <option value="intermedio">Intermedio</option>
                        <option value="avanzado">Avanzado</option>
                    </select>
                </div>

                <div>
                    <p>¿Posee experiencia previa?</p>

                    <input type="radio"
                           id="experiencia-si"
                           name="experiencia"
                           value="si">
                    <label for="experiencia-si">Sí</label>

                    <input type="radio"
                           id="experiencia-no"
                           name="experiencia"
                           value="no">
                    <label for="experiencia-no">No</label>
                </div>

                <div>
                    <label for="observaciones">Observaciones:</label>
                    <br>

                    <textarea id="observaciones"
                              name="observaciones"
                              rows="5"
                              cols="40"></textarea>
                </div>

            </fieldset>


            <!-- Aceptación de condiciones -->
            <fieldset>
                <legend>Aceptación de condiciones</legend>

                <div>
                    <input type="checkbox"
                           id="condiciones"
                           name="condiciones"
                           required>

                    <label for="condiciones">
                        Acepto las condiciones de inscripción.
                    </label>
                </div>

            </fieldset>


            <!-- Botones -->
            <div>
                <button type="submit">Aceptar</button>
                <button type="reset">Cancelar</button>
            </div>

        </form>

    </main>

    <footer>
        <p>Deportes Unca – 2026</p>
    </footer>

</body>

</html>
