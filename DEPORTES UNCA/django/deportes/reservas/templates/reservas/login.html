
{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Deportes UNCA</title>
    <link rel="stylesheet" href="{% static 'reservas/estilos.css' %}">
</head>
<body>

    <header class="encabezado">
        <h1>Deportes UNCA</h1>
    </header>

    <main class="contenedor-principal">
        <section class="panel-formulario">
            <h2>Iniciar sesión</h2>
            <p>Ingresá tus datos para acceder.</p>

            {% if messages %}
                <div class="notificaciones">
                    {% for message in messages %}
                        <p class="notificacion">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="campo-formulario">
                    <label for="username">Nombre de usuario:</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="password">Contraseña:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >
                </div>

                <button type="submit" class="boton boton-principal">
                    Iniciar sesión
                </button>
            </form>
        </section>
    </main>

    <footer class="pie-pagina">
        <p>Deportes UNCA</p>
    </footer>

</body>
</html>
